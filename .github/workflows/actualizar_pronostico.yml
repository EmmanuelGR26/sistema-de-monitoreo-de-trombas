name: Actualizar Pronóstico de Trombas

on:
  repository_dispatch:
    types: [activar_radar]
  workflow_dispatch:

permissions:
  contents: write # ESTO ES VITAL PARA PODER GUARDAR EL JSON

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python chapala_trombas_monitor.py
      
      - name: Guardar y subir a GitHub (Para actualizar Vercel)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/*.json
          git commit -m "Actualización automática de pronóstico" || echo "No hay cambios para subir"
          # Descargar cambios remotos y si hay conflicto, conservar nuestra versión (-X ours)
          git pull origin main --no-rebase -X ours
          git push
