name: Actualizar Pronóstico de Trombas

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write # ESTO ES VITAL PARA PODER GUARDAR EL JSON

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python chapala_trombas_monitor.py
      
      - name: Guardar y subir a GitHub (Para actualizar Vercel)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/pronostico.json public/estado_previo.json
          git commit -m "Actualización automática de pronóstico" || echo "No hay cambios para subir"
          git push
