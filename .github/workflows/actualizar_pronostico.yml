name: Actualizar Pronóstico de Trombas

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# ESTO ES LO NUEVO: Le damos permiso al robot de guardar archivos
permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clonar el repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ejecutar el Monitor de Trombas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python chapala_trombas_monitor.py

      - name: 5. Guardar y subir el nuevo pronostico.json
        run: |
          if [ ! -f public/pronostico.json ]; then
            echo "El archivo public/pronostico.json no existe. Saltando paso de subida."
            exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "Robot Chapala"
          git add public/pronostico.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualización automática: nuevos datos SWI"
          git push
